name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches: [ main ]

jobs:
  validate-pdfs:
    name: Validate PDF Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PDFs exist
        run: |
          count=$(find . -name "*.pdf" -type f | wc -l)
          echo "Found $count PDF file(s)"
          if [ "$count" -eq 0 ]; then
            echo "❌ No PDF files found in the repository!"
            exit 1
          fi

      - name: Validate PDF integrity
        run: |
          echo "Checking each PDF..."
          fail=0
          while IFS= read -r f; do
            size=$(stat -c%s "$f")
            if [ "$size" -lt 1000 ]; then
              echo "❌ $f is too small ($size bytes) — likely corrupted"
              fail=1
            elif ! head -c 4 "$f" | grep -q "%PDF"; then
              echo "❌ $f does not have a valid PDF header"
              fail=1
            else
              echo "✅ $f is valid ($size bytes)"
            fi
          done < <(find . -name "*.pdf" -type f)
          if [ "$fail" -eq 1 ]; then
            echo "One or more PDFs failed validation."
            exit 1
          fi

      - name: List all PDFs
        run: |
          echo "📄 PDFs in this repository:"
          find . -name "*.pdf" -type f -exec ls -lh {} \;

      - name: Show changed files
        run: |
          echo "🔍 Event: ${{ github.event_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "Ref:   ${{ github.ref }}"
          echo "---"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
            echo "Base: ${{ github.event.pull_request.base.ref }}"
            echo "Head: ${{ github.event.pull_request.head.ref }}"
            echo "Changed files:"
            git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD || echo "(unable to compute diff)"
          else
            echo "Commit: ${{ github.event.head_commit.message }}"
            echo "Changed files:"
            git diff --name-only HEAD^ HEAD || echo "(no parent commit — first push)"
          fi

  test:
    name: Build & Test (Node.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite (unit, integration, system, security, performance)
        run: npm test

      - name: Smoke test the running server
        run: |
          PORT=3000 npm start > server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/api/v1/health; then echo; echo "✅ server healthy"; exit 0; fi
            sleep 1
          done
          echo "❌ server did not become healthy"; cat server.log; exit 1

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t iwas:${{ github.sha }} .

      - name: Run container and check health
        run: |
          docker run -d --name iwas -p 3000:3000 iwas:${{ github.sha }}
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/api/v1/health; then echo; echo "✅ container healthy"; exit 0; fi
            sleep 1
          done
          docker logs iwas; exit 1
