<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IWAS – Insurance Workflow Automation</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true">◆</span> IWAS</div>
    <nav id="nav" aria-label="Main navigation"></nav>
    <div class="user">
      <label class="sr-only" for="lang">Language</label>
      <select id="lang">
        <option value="en">English</option>
        <option value="hi">हिन्दी</option>
      </select>
      <span id="whoami"></span>
      <button id="logout" class="ghost" hidden>Log out</button>
    </div>
  </header>
  <div id="toast" role="status" aria-live="polite"></div>
  <main id="main" tabindex="-1"></main>
  <script src="app.js"></script>
</body>
</html>
